# Check the files on every push to main or dev.
# Runs on the Pi's ARC runner (nekko-runners); it needs no access to the cluster.
# The real tests run on the Pi: ./tests/run-all.sh
name: Mailpit Checks

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # runs-on: nekko-runners  #  nekko-runners requires a private repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # Scripts: syntax and real errors (shellcheck from Ubuntu's packages)
      - name: Check scripts
        run: |
          for f in *.sh tests/*.sh; do bash -n "$f"; done
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error *.sh tests/*.sh

      # Manifest: valid Kubernetes objects (ARM64 build for the Pi)
      - name: Check manifest
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-arm64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary mailpit.yaml
