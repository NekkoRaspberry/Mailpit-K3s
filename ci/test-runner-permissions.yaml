# Access for the CI runner (mailpit-runners) to run tests/ - nothing more.
# Apply with: kubectl apply -f ci/test-runner-permissions.yaml

# Permanent namespace for test apps (tests empty it after each run)
apiVersion: v1
kind: Namespace
metadata:
  name: mailtest
---
# Identity used by the runner pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mailpit-tests
  namespace: arc-runners
---
# In "email": check health, add/remove test logins, restart Mailpit, check for drift
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mailpit-tests
  namespace: email
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [mailpit-0]        # restart test
    verbs: [delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mailpit-smtp-users, mailpit-ui]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mailpit-smtp-users]   # add/remove app logins
    verbs: [patch]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [mailpit]          # drift check (dry-run)
    verbs: [patch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [mailpit]          # restart after login changes, drift check
    verbs: [patch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mailpit-tests
  namespace: email
subjects:
  - kind: ServiceAccount
    name: mailpit-tests
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mailpit-tests
---
# In "mailtest": test app secrets and the test client pod
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mailpit-tests
  namespace: mailtest
rules:
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mailpit-tests
  namespace: mailtest
subjects:
  - kind: ServiceAccount
    name: mailpit-tests
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mailpit-tests
---
# Namespaces: new-app-email.sh checks the app namespace (only mailtest),
# drift check reads "email"
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mailpit-tests
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [mailtest, email]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mailpit-tests
subjects:
  - kind: ServiceAccount
    name: mailpit-tests
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mailpit-tests
