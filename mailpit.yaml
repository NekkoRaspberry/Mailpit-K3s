# Mailpit for K3s: namespace, internal service, storage and the mail catcher itself
# Apply with: kubectl apply -f mailpit.yaml

# Separate namespace for shared email services
apiVersion: v1
kind: Namespace
metadata:
  name: email
---
# Internal-only addresses (ClusterIP: not reachable from outside the cluster)
#   SMTP for apps:    mailpit.email.svc.cluster.local:1025
#   Web UI + API:     mailpit.email.svc.cluster.local:8025
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: email
spec:
  type: ClusterIP
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
---
# Stored emails, kept when Mailpit restarts (e.g. after adding an app)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailpit-data
  namespace: email
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# One shared Mailpit for multiple applications.
# Catches every email (nothing is delivered to real inboxes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: email
spec:
  replicas: 1
  strategy:
    type: Recreate   # stop the old pod before starting the new one (storage can only be used by one)
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534     # "nobody"
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: mailpit
          # Official image, supports ARM64
          image: axllent/mailpit:v1.31.6
          args:
            - --database=/data/mailpit.db
            - --max=500                       # keep only the newest 500 emails
            # One login per app (managed by new-app-email.sh)
            - --smtp-auth-file=/auth/smtp-users
            - --smtp-auth-allow-insecure      # no TLS needed inside the cluster
            # Tag each email with the app that sent it
            - --tags-username
            # Password for the web UI and API
            - --ui-auth-file=/auth-ui/ui-users
            # No calls to the internet
            - --disable-version-check
            - --smtp-disable-rdns
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["/mailpit", "readyz"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/mailpit", "readyz"]
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
            - name: smtp-users
              mountPath: /auth
              readOnly: true
            - name: ui-users
              mountPath: /auth-ui
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mailpit-data
        # App logins (hashed): Secret mailpit-smtp-users, key smtp-users
        - name: smtp-users
          secret:
            secretName: mailpit-smtp-users
        # Web UI login (hashed): Secret mailpit-ui, key ui-users
        - name: ui-users
          secret:
            secretName: mailpit-ui
            items:
              - key: ui-users
                path: ui-users
